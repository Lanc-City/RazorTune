name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a tag like v1.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Builds a release APK.
      # Note: Make sure signingConfig is set up in app/build.gradle.kts,
      # or change assembleRelease to assembleDebug if you haven't configured a keystore yet.
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true